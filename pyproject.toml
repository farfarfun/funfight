[project]
name = "funfight"
version = "0.0.5"
description = "阿里天池 531800 赛题参赛代码存档：基于 Flink AI Flow 编排的流批一体工作流，含 Kafka 数据源、AutoEncoder 训练与在线预测、Proxima 向量索引构建与相似检索"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "fundrive[lanzou]>=2.0.57",
    "farlog>=1.1.8",
    "funshell>=1.0.23",
]
# 注：仓库内 src/funfight/tianchi/t531800/ 下的天池比赛存档代码还依赖
# ai_flow、flink_ai_flow、python_ai_flow、pyflink、pyproxima2、kafka-python、
# tensorflow、pandas、PyYAML、zoo.serving.client 等比赛当年的特定版本环境。
# 其中（2026-10 复核）：
#   - flink_ai_flow / python_ai_flow / pyproxima2 从未发布到公开 PyPI；
#   - ai_flow 在 PyPI 上叫 ai-flow，最新 0.3.1、比赛用的是 0.1.0，但它声明
#     requires-python >=3.7,<3.8，和本包的 requires-python >=3.10 直接冲突，
#     写进 dependencies 会让 uv/pip 在任何现代环境里都解不出来；
#   - zoo.serving.client 来自 analytics-zoo，同样是面向老 Python/Spark 的历史包。
# 其余包版本也需与 README「依赖」一节描述的历史环境（Flink 1.11.0 / Kafka 2.3.0
# 等）匹配，写进这里的下限版本号意义不大。因此一律不在此处声明，避免营造
# 「pip install funfight 即可运行」的假象。详见 README。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funfight"]

[tool.pytest.ini_options]
# "src" 让 `import funfight` 可用；python_codes 目录按 README 的说明被扁平导入
# （`from feature_predict import ...` 等），测试 feature_predict.py 需要它在路径上。
pythonpath = ["src", "src/funfight/tianchi/t531800/package/python_codes"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.ruff.lint]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
